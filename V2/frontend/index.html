<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Wettertagebuch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: linear-gradient(to bottom right, #f0f4f8, #ffffff);
      font-family: Arial, sans-serif;
    }
    header {
      background: #ffffff;
      padding: 1rem 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .section {
      padding: 60px 0;
      display: none;
    }
    .section.active {
      display: block;
    }
    .section-title {
      margin-bottom: 40px;
      text-align: center;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    footer {
      text-align: center;
      padding: 1rem 0;
      font-size: 0.9rem;
      color: #555;
      background: #f8f9fa;
      margin-top: 40px;
    }
    .login-section {
      max-width: 400px;
      margin: 60px auto;
    }
    .role-hint {
      font-size: 0.85rem;
      color: #6c757d;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<header>
  <div class="container d-flex flex-wrap justify-content-between align-items-center">
    <h2 class="mb-0">Wettertagebuch</h2>
    <div id="authStatus">
      <button class="btn btn-outline-primary btn-sm" onclick="showSection('login')">Login</button>
    </div>
  </div>
</header>

<main class="container">

  <!-- START SEITE -->
  <section id="home" class="section active">
    <div class="text-center">
      <h1 class="section-title">Willkommen im Wettertagebuch!</h1>
      <div class="row mt-5 justify-content-center g-4" id="homeCards">
        <!-- Will be filled by JS based on role -->
      </div>
    </div>
  </section>

  <!-- LOGIN -->
  <section id="login" class="section">
    <div class="login-section">
      <h2 class="text-center mb-4">Anmelden</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email *</label>
          <input type="email" class="form-control" id="loginEmail" required>
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Passwort *</label>
          <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Anmelden</button>
        </div>
        <div id="loginMessage" class="mt-3"></div>
        <div class="text-center mt-3">
          <button type="button" class="btn btn-link" onclick="showSection('home')">Zurück</button>
        </div>
      </form>
      <div class="role-hint">
        Test-Daten:<br>
        Admin: admin@example.com / admin123<br>
        User: user@example.com / user123
      </div>
    </div>
  </section>

  <!-- DATENERFASSUNG -->
  <section id="erfassung" class="section">
    <div class="back-btn">
      <button class="btn btn-outline-dark" onclick="showSection('home')">← Zurück</button>
    </div>
    <h2 class="section-title">Datenerfassung</h2>
    <div class="card p-4 mx-auto" style="max-width:600px;">
      <form id="weatherForm">
        <div class="mb-3">
          <label class="form-label">Datum *</label>
          <input type="date" class="form-control" id="datum" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Temperatur (°C) *</label>
          <input type="number" class="form-control" id="temperatur" step="0.1" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Regen</label>
          <select class="form-select" id="regen">
            <option value="Nein">Nein</option>
            <option value="Ja">Ja</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Luftfeuchtigkeit (%)</label>
          <input type="number" class="form-control" id="luftfeuchtigkeit" min="0" max="100" step="0.1">
        </div>
        <div class="mb-3">
          <label class="form-label">Luftdruck (hPa)</label>
          <input type="number" class="form-control" id="luftdruck" step="0.1">
        </div>
        <div class="mb-3">
          <label class="form-label">Windgeschwindigkeit (km/h)</label>
          <input type="number" class="form-control" id="windgeschwindigkeit" step="0.1">
        </div>
        <div class="d-flex justify-content-between">
          <button type="reset" class="btn btn-secondary">Zurücksetzen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
        <div id="meldung" class="mt-3"></div>
      </form>
    </div>
  </section>

  <!-- VERWALTUNG -->
  <section id="verwaltung" class="section">
    <div class="back-btn">
      <button class="btn btn-outline-dark" onclick="showSection('home')">← Zurück</button>
    </div>
    <h2 class="section-title">Verwaltung</h2>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Temperatur</th>
            <th>Regen</th>
            <th>Luftfeuchte</th>
            <th>Luftdruck</th>
            <th>Wind</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="datenTabelle"></tbody>
      </table>
    </div>
  </section>

  <!-- AUSWERTUNG -->
  <section id="auswertung" class="section">
    <div class="back-btn">
      <button class="btn btn-outline-dark" onclick="showSection('home')">← Zurück</button>
    </div>
    <h2 class="section-title">Auswertung</h2>
    <div id="statistik" class="text-center mb-4"></div>
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Temperaturverlauf</h5>
        <canvas id="temperaturChart" height="400"></canvas>
      </div>
    </div>
  </section>

</main>

<script>
let currentUser = null;

// ========== UTILS ==========
function showSection(id) {
  // Role-based access control
  if (id === 'erfassung' && currentUser?.role !== 'admin') {
    alert('Nur Admins dürfen Daten erfassen.');
    return;
  }
  if (id === 'verwaltung' && currentUser?.role !== 'admin') {
    alert('Nur Admins dürfen Einträge verwalten.');
    return;
  }

  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  if (id === 'verwaltung') loadTable();
  if (id === 'auswertung') loadStatistics();
  if (id === 'home') renderHomeCards();
}

function renderHomeCards() {
  const container = document.getElementById('homeCards');
  container.innerHTML = '';

  const cards = [];

  if (currentUser?.role === 'admin') {
    cards.push(
      { title: 'Datenerfassung', desc: 'Neue Wetterbeobachtungen erfassen', action: 'erfassung' },
      { title: 'Verwaltung', desc: 'Einträge bearbeiten oder löschen', action: 'verwaltung' }
    );
  }

  cards.push(
    { title: 'Auswertung', desc: 'Statistiken und Diagramme', action: 'auswertung' }
  );

  container.innerHTML = cards.map(c => `
    <div class="col-md-4">
      <div class="card p-4 h-100">
        <h5 class="card-title">${c.title}</h5>
        <p class="card-text">${c.desc}</p>
        <button class="btn btn-primary w-100" onclick="showSection('${c.action}')">Öffnen</button>
      </div>
    </div>
  `).join('');
}

// ========== AUTH ==========
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMessage');

  try {
    const res = await fetch('http://localhost:4000/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (res.ok) {
      currentUser = data.user;
      document.getElementById('authStatus').innerHTML = 
        `Angemeldet als ${currentUser.name} (${currentUser.role}) • 
         <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>`;
      showSection('home');
    } else {
      msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
    }
  } catch (err) {
    msg.innerHTML = `<div class="alert alert-danger">Netzwerkfehler</div>`;
  }
});

function logout() {
  currentUser = null;
  document.getElementById('authStatus').innerHTML = 
    '<button class="btn btn-outline-primary btn-sm" onclick="showSection(\'login\')">Login</button>';
  showSection('home');
}

// ========== WEATHER FORM ==========
document.getElementById('weatherForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    date: new Date(document.getElementById('datum').value).toISOString(),
    temperature: parseFloat(document.getElementById('temperatur').value),
    windspeed: parseFloat(document.getElementById('windgeschwindigkeit').value) || 0,
    humidity: parseFloat(document.getElementById('luftfeuchtigkeit').value) || 0,
    pressure: parseFloat(document.getElementById('luftdruck').value) || 0,
    rainfall: document.getElementById('regen').value === 'Ja' ? 1 : 0
  };

  const msg = document.getElementById('meldung');

  try {
    const res = await fetch('http://localhost:4000/weather', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      msg.innerHTML = '<div class="alert alert-success">Gespeichert!</div>';
      document.getElementById('weatherForm').reset();
    } else {
      msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
    }
  } catch (err) {
    msg.innerHTML = '<div class="alert alert-danger">Netzwerkfehler</div>';
  }
});

// ========== TABLE & STATS ==========
async function loadTable() {
  const tbody = document.getElementById('datenTabelle');
  tbody.innerHTML = '<tr><td colspan="7" class="text-center">Lädt...</td></tr>';

  try {
    const res = await fetch('http://localhost:4000/weather');
    const data = await res.json();
    tbody.innerHTML = data.map(d => `
      <tr>
        <td>${d.date.split('T')[0]}</td>
        <td>${d.temperature}°C</td>
        <td>${d.rainfall > 0 ? 'Ja' : 'Nein'}</td>
        <td>${d.humidity}%</td>
        <td>${d.pressure}</td>
        <td>${d.windspeed}</td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteEntry(${d.id})">Löschen</button></td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-danger">Fehler beim Laden</td></tr>';
  }
}

async function deleteEntry(id) {
  if (!confirm('Wirklich löschen?')) return;
  try {
    await fetch(`http://localhost:4000/weather/${id}`, { method: 'DELETE' });
    loadTable();
  } catch (err) {
    alert('Fehler beim Löschen');
  }
}

async function loadStatistics() {
  const el = document.getElementById('statistik');
  el.innerHTML = '<p>Lädt Statistiken...</p>';

  try {
    const res = await fetch('http://localhost:4000/weather');
    const data = await res.json();

    if (data.length === 0) {
      el.innerHTML = '<p>Keine Daten vorhanden.</p>';
      return;
    }

    const count = data.length;
    const avgTemp = (data.reduce((s,d) => s + d.temperature, 0) / count).toFixed(1);
    const rainy = data.filter(d => d.rainfall > 0).length;
    const pctRain = ((rainy / count) * 100).toFixed(0);

    el.innerHTML = `
      <p><strong>Datenpunkte:</strong> ${count}</p>
      <p><strong>Durchschnittstemperatur:</strong> ${avgTemp} °C</p>
      <p><strong>Regnerische Tage:</strong> ${rainy} (${pctRain}%)</p>
    `;
  } catch (err) {
    el.innerHTML = '<p class="text-danger">Fehler beim Laden der Statistik</p>';
  }
}

// ========== INIT ==========
showSection('home');
</script>

</body>
</html>
