<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Wettertagebuch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: linear-gradient(to bottom right, #f0f4f8, #ffffff);
      font-family: Arial, sans-serif;
    }
    header {
      background: #ffffff;
      padding: 1rem 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card-body {
      max-height: 500px;
     overflow-y: auto;
    }
    .section {
      padding: 60px 0;
      display: none;
    }
    .section.active {
      display: block;
    }
    .section-title {
      margin-bottom: 40px;
      text-align: center;
    }
    #temperaturChart {
      height: 400px;
      width: 100%;
      max-width: 100%;
      margin: 20px 0;
    }

    .card .card-body #temperaturChart {
      height: 300px;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .login-section {
      max-width: 450px;
      margin: 60px auto;
    }
    .role-hint {
      font-size: 0.85rem;
      color: #6c757d;
      margin-top: 10px;
    }
    .auth-toggle {
      text-align: center;
      margin-top: 15px;
    }
    .modal {
      display: none;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
    }
    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
    }
    .back-btn {
      margin-bottom: 20px;
    }
    #temperaturChart {
      height: 200px;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <div class="container d-flex flex-wrap justify-content-between align-items-center">
    <h2 class="mb-0">Wettertagebuch</h2>
    <div id="authStatus">
      <button class="btn btn-outline-primary btn-sm" onclick="showSection('auth')">Login / Registrieren</button>
    </div>
  </div>
</header>

<main class="container">

  <!-- START SEITE -->
  <section id="home" class="section active">
    <div class="text-center">
      <h1 class="section-title">Willkommen im Wettertagebuch!</h1>
      <div class="row mt-5 justify-content-center g-4" id="homeCards">
        <!-- Filled dynamically -->
      </div>
    </div>
  </section>

  <!-- LOGIN / REGISTER -->
  <section id="auth" class="section">
    <div class="login-section">
      <h2 class="text-center mb-4" id="authTitle">Anmelden</h2>
      <form id="authForm">
        <div class="mb-3" id="nameField" style="display:none;">
          <label class="form-label">Name *</label>
          <input type="text" class="form-control" id="authName">
        </div>
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" class="form-control" id="authEmail" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Passwort *</label>
          <input type="password" class="form-control" id="authPassword" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary" id="authSubmitBtn">Anmelden</button>
        </div>
        <div id="authMessage" class="mt-3"></div>
        <div class="auth-toggle">
          <button type="button" class="btn btn-link p-0" id="toggleAuth">Noch kein Konto? Registrieren</button>
          <button type="button" class="btn btn-link p-0" id="backToLogin" style="display:none;">Zurück zum Login</button>
        </div>
      </form>
      <div class="role-hint">
        Testdaten:<br>
        Admin: <code>admin@example.com</code> / <code>admin123</code>
      </div>
    </div>
  </section>

  <!-- DATENERFASSUNG -->
  <section id="erfassung" class="section">
    <div class="back-btn">
      <button class="btn btn-outline-dark" onclick="showSection('home')">← Zurück</button>
    </div>
    <h2 class="section-title">Datenerfassung</h2>
    <div class="card p-4 mx-auto" style="max-width:600px;">
      <form id="weatherForm">
        <div class="mb-3">
          <label class="form-label">Datum *</label>
          <input type="date" class="form-control" id="datum" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Temperatur (°C) *</label>
          <input type="number" class="form-control" id="temperatur" step="0.1" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Regen</label>
          <select class="form-select" id="regen">
            <option value="Nein">Nein</option>
            <option value="Ja">Ja</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Luftfeuchtigkeit (%)</label>
          <input type="number" class="form-control" id="luftfeuchtigkeit" min="0" max="100" step="0.1">
        </div>
        <div class="mb-3">
          <label class="form-label">Luftdruck (hPa)</label>
          <input type="number" class="form-control" id="luftdruck" step="0.1">
        </div>
        <div class="mb-3">
          <label class="form-label">Windgeschwindigkeit (km/h)</label>
          <input type="number" class="form-control" id="windgeschwindigkeit" step="0.1">
        </div>
        <div class="d-flex justify-content-between">
          <button type="reset" class="btn btn-secondary">Zurücksetzen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
        <div id="meldung" class="mt-3"></div>
      </form>
    </div>
  </section>

  <!-- VERWALTUNG -->
  <section id="verwaltung" class="section">
    <div class="back-btn">
      <button class="btn btn-outline-dark" onclick="showSection('home')">← Zurück</button>
    </div>
    <h2 class="section-title">Verwaltung</h2>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Temperatur</th>
            <th>Regen</th>
            <th>Luftfeuchte</th>
            <th>Luftdruck</th>
            <th>Wind</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="datenTabelle"></tbody>
      </table>
    </div>
  </section>

  <!-- AUSWERTUNG -->
  <section id="auswertung" class="section">
    <div class="back-btn">
      <button class="btn btn-outline-dark" onclick="showSection('home')">← Zurück</button>
    </div>
    <h2 class="section-title">Auswertung</h2>
    <div id="statistik" class="text-center mb-4"></div>
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Temperaturverlauf</h5>
        <canvas id="temperaturChart"></canvas>
      </div>
    </div>
  </section>

</main>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h5>Wettereintrag bearbeiten</h5>
    <form id="editForm">
      <input type="hidden" id="editId">
      <div class="mb-3">
        <label class="form-label">Datum *</label>
        <input type="date" class="form-control" id="editDatum" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Temperatur (°C) *</label>
        <input type="number" class="form-control" id="editTemperatur" step="0.1" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Regen</label>
        <select class="form-select" id="editRegen">
          <option value="Nein">Nein</option>
          <option value="Ja">Ja</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Luftfeuchtigkeit (%)</label>
        <input type="number" class="form-control" id="editLuftfeuchtigkeit" min="0" max="100" step="0.1">
      </div>
      <div class="mb-3">
        <label class="form-label">Luftdruck (hPa)</label>
        <input type="number" class="form-control" id="editLuftdruck" step="0.1">
      </div>
      <div class="mb-3">
        <label class="form-label">Windgeschwindigkeit (km/h)</label>
        <input type="number" class="form-control" id="editWindgeschwindigkeit" step="0.1">
      </div>
      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" id="closeEditModalBtn">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
    <div id="editMessage" class="mt-3"></div>
  </div>
</div>

<script>
let currentUser = null;
let isRegisterMode = false;

// ========== SECTION MANAGEMENT ==========
function showSection(id) {
  if (id === 'erfassung' && currentUser?.role !== 'admin') {
    alert('Nur Admins dürfen Daten erfassen.');
    return;
  }
  if (id === 'verwaltung' && currentUser?.role !== 'admin') {
    alert('Nur Admins dürfen Einträge verwalten.');
    return;
  }

  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  if (id === 'verwaltung') loadTable();
  if (id === 'auswertung') loadStatistics();
  if (id === 'home') renderHomeCards();
}

function renderHomeCards() {
  const container = document.getElementById('homeCards');
  const cards = [];

  if (currentUser?.role === 'admin') {
    cards.push(
      { title: 'Datenerfassung', desc: 'Neue Wetterbeobachtungen erfassen', action: 'erfassung' },
      { title: 'Verwaltung', desc: 'Einträge bearbeiten oder löschen', action: 'verwaltung' }
    );
  }
  cards.push({ title: 'Auswertung', desc: 'Statistiken und Diagramme', action: 'auswertung' });

  container.innerHTML = cards.map(c => `
    <div class="col-md-4">
      <div class="card p-4 h-100">
        <h5 class="card-title">${c.title}</h5>
        <p class="card-text">${c.desc}</p>
        <button class="btn btn-primary w-100" onclick="showSection('${c.action}')">Öffnen</button>
      </div>
    </div>
  `).join('');
}

// ========== AUTHENTICATION ==========
function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  const title = document.getElementById('authTitle');
  const submitBtn = document.getElementById('authSubmitBtn');
  const nameField = document.getElementById('nameField');
  const toggleBtn = document.getElementById('toggleAuth');
  const backBtn = document.getElementById('backToLogin');

  if (isRegisterMode) {
    title.textContent = 'Registrieren';
    submitBtn.textContent = 'Registrieren';
    nameField.style.display = 'block';
  } else {
    title.textContent = 'Anmelden';
    submitBtn.textContent = 'Anmelden';
    nameField.style.display = 'none';
  }

  toggleBtn.style.display = isRegisterMode ? 'none' : 'inline-block';
  backBtn.style.display = isRegisterMode ? 'inline-block' : 'none';
  document.getElementById('authMessage').innerHTML = '';
  document.getElementById('authForm').reset();
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const msg = document.getElementById('authMessage');
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;

  if (isRegisterMode) {
    const name = document.getElementById('authName').value;
    if (!name || !email || !password) {
      msg.innerHTML = '<div class="alert alert-danger">Alle Felder sind erforderlich</div>';
      return;
    }

    try {
      const res = await fetch('http://localhost:4000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (res.ok) {
        msg.innerHTML = '<div class="alert alert-success">Registrierung erfolgreich!</div>';
        setTimeout(() => toggleAuthMode(), 2000);
      } else {
        msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
      }
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-danger">Netzwerkfehler</div>';
    }
  } else {
    if (!email || !password) {
      msg.innerHTML = '<div class="alert alert-danger">Email und Passwort erforderlich</div>';
      return;
    }

    try {
      const res = await fetch('http://localhost:4000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (res.ok) {
        currentUser = data.user;
        document.getElementById('authStatus').innerHTML = 
          `Angemeldet als ${currentUser.name} (${currentUser.role}) • 
           <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>`;
        showSection('home');
      } else {
        msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
      }
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-danger">Netzwerkfehler</div>';
    }
  }
}

function logout() {
  currentUser = null;
  document.getElementById('authStatus').innerHTML = 
    '<button class="btn btn-outline-primary btn-sm" onclick="showSection(\'auth\')">Login / Registrieren</button>';
  showSection('home');
}

// ========== WEATHER FORM (CREATE) ==========
async function handleWeatherSubmit(e) {
  e.preventDefault();
  const payload = {
    date: new Date(document.getElementById('datum').value).toISOString(),
    temperature: parseFloat(document.getElementById('temperatur').value),
    windspeed: parseFloat(document.getElementById('windgeschwindigkeit').value) || 0,
    humidity: parseFloat(document.getElementById('luftfeuchtigkeit').value) || 0,
    pressure: parseFloat(document.getElementById('luftdruck').value) || 0,
    rainfall: document.getElementById('regen').value === 'Ja' ? 1 : 0
  };

  const msg = document.getElementById('meldung');
  try {
    const res = await fetch('http://localhost:4000/weather', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      msg.innerHTML = '<div class="alert alert-success">Wetterdaten gespeichert!</div>';
      document.getElementById('weatherForm').reset();
    } else {
      msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
    }
  } catch (err) {
    msg.innerHTML = '<div class="alert alert-danger">Netzwerkfehler</div>';
  }
}

// ========== DATA DISPLAY ==========
async function loadTable() {
  const tbody = document.getElementById('datenTabelle');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="7" class="text-center">Lädt...</td></tr>';

  try {
    const res = await fetch('http://localhost:4000/weather');
    const data = await res.json();
    tbody.innerHTML = data.map(d => `
      <tr>
        <td>${d.date.split('T')[0]}</td>
        <td>${d.temperature}°C</td>
        <td>${d.rainfall > 0 ? 'Ja' : 'Nein'}</td>
        <td>${d.humidity != null ? d.humidity + '%' : '-'}</td>
        <td>${d.pressure != null ? d.pressure : '-'}</td>
        <td>${d.windspeed != null ? d.windspeed : '-'}</td>
        <td>
          <button class="btn btn-sm btn-primary me-1 edit-btn" data-id="${d.id}">Bearbeiten</button>
          <button class="btn btn-sm btn-danger delete-btn" data-id="${d.id}">Löschen</button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-danger text-center">Fehler beim Laden</td></tr>';
  }
}

// ========== DELETE ==========
async function deleteEntry(id) {
  if (id === undefined || id === null || (typeof id === 'string' && id.trim() === '')) {
    console.warn('deleteEntry called with invalid id:', id);
    return;
  }

  if (!confirm('Möchten Sie diesen Eintrag wirklich löschen?')) return;

  try {
    const res = await fetch(`http://localhost:4000/weather/${encodeURIComponent(id)}`, { 
      method: 'DELETE' 
    });

    if (res.ok) {
      alert('Eintrag erfolgreich gelöscht!');
      loadTable();
      if (document.getElementById('auswertung').classList.contains('active')) {
        loadStatistics();
      }
    } else {
      const data = await res.json();
      alert(data.error || 'Fehler beim Löschen');
    }
  } catch (err) {
    alert('Netzwerkfehler: ' + err.message);
  }
}

// ========== EDIT ==========
async function editEntry(id) {
  if (id === undefined || id === null || (typeof id === 'string' && id.trim() === '')) {
    console.warn('editEntry called with invalid id:', id);
    return;
  }

  try {
    const res = await fetch(`http://localhost:4000/weather/${encodeURIComponent(id)}`);
    if (!res.ok) throw new Error('Daten nicht gefunden');
    const entry = await res.json();

    document.getElementById('editId').value = entry.id;
    document.getElementById('editDatum').value = entry.date.split('T')[0];
    document.getElementById('editTemperatur').value = entry.temperature;
    document.getElementById('editRegen').value = entry.rainfall > 0 ? 'Ja' : 'Nein';
    document.getElementById('editLuftfeuchtigkeit').value = entry.humidity || '';
    document.getElementById('editLuftdruck').value = entry.pressure || '';
    document.getElementById('editWindgeschwindigkeit').value = entry.windspeed || '';

    document.getElementById('editModal').style.display = 'flex';
  } catch (err) {
    alert('Fehler beim Laden: ' + err.message);
  }
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  document.getElementById('editForm').reset();
  document.getElementById('editMessage').innerHTML = '';
}

async function handleEditSubmit(e) {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  
  const payload = {
    date: new Date(document.getElementById('editDatum').value).toISOString(),
    temperature: parseFloat(document.getElementById('editTemperatur').value),
    windspeed: parseFloat(document.getElementById('editWindgeschwindigkeit').value) || 0,
    humidity: parseFloat(document.getElementById('editLuftfeuchtigkeit').value) || 0,
    pressure: parseFloat(document.getElementById('editLuftdruck').value) || 0,
    rainfall: document.getElementById('editRegen').value === 'Ja' ? 1 : 0
  };

  const msg = document.getElementById('editMessage');
  try {
    const res = await fetch(`http://localhost:4000/weather/${encodeURIComponent(id)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (res.ok) {
      msg.innerHTML = '<div class="alert alert-success">Änderungen gespeichert!</div>';
      setTimeout(() => {
        closeEditModal();
        loadTable();
        if (document.getElementById('auswertung').classList.contains('active')) {
          loadStatistics();
        }
      }, 1000);
    } else {
      msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
    }
  } catch (err) {
    msg.innerHTML = `<div class="alert alert-danger">Netzwerkfehler: ${err.message}</div>`;
  }
}

// ========== STATISTICS & CHART ==========
async function loadStatistics() {
  const el = document.getElementById('statistik');
  const canvas = document.getElementById('temperaturChart');
  if (!el || !canvas) return;
  
  el.innerHTML = '<p>Lädt Statistiken...</p>';

  try {
    const res = await fetch('http://localhost:4000/weather');
    const data = await res.json();

    if (data.length === 0) {
      el.innerHTML = '<p class="text-muted">Keine Daten vorhanden.</p>';
      if (window.temperaturChart && typeof window.temperaturChart.destroy === 'function') {
        window.temperaturChart.destroy();
        window.temperaturChart = null;
      }
      return;
    }

    const count = data.length;
    const avgTemp = (data.reduce((s, d) => s + d.temperature, 0) / count).toFixed(1);
    const rainy = data.filter(d => d.rainfall > 0).length;
    const rainPercent = ((rainy / count) * 100).toFixed(0);

    const humidVals = data.map(d => d.humidity).filter(v => v != null && !isNaN(v));
    const avgHum = humidVals.length ? (humidVals.reduce((s, v) => s + v, 0) / humidVals.length).toFixed(1) : '-';

    const pressureVals = data.map(d => d.pressure).filter(v => v != null && !isNaN(v));
    const avgPressure = pressureVals.length ? (pressureVals.reduce((s, v) => s + v, 0) / pressureVals.length).toFixed(1) : '-';

    const windVals = data.map(d => d.windspeed).filter(v => v != null && !isNaN(v));
    const avgWind = windVals.length ? (windVals.reduce((s, v) => s + v, 0) / windVals.length).toFixed(1) : '-';

    el.innerHTML = `
      <p><strong>Anzahl Einträge:</strong> ${count}</p>
      <p><strong>Durchschnittstemperatur:</strong> ${avgTemp} °C</p>
      <p><strong>Regnerische Tage:</strong> ${rainy} (${rainPercent}%)</p>
      <p><strong>Durchschnitt Luftfeuchtigkeit:</strong> ${avgHum}${avgHum !== '-' ? ' %' : ''}</p>
      <p><strong>Durchschnitt Luftdruck:</strong> ${avgPressure}${avgPressure !== '-' ? ' hPa' : ''}</p>
      <p><strong>Durchschnitt Windgeschwindigkeit:</strong> ${avgWind}${avgWind !== '-' ? ' km/h' : ''}</p>
    `;

    const sortedData = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
    const chartData = sortedData
      .map(d => {
        const dateObj = new Date(d.date);
        return {
          date: dateObj,
          temp: d.temperature
        };
      })
      .filter(d => !isNaN(d.temp) && !isNaN(d.date.getTime()));

    if (chartData.length === 0) {
      el.innerHTML += '<p><em>Keine Temperaturdaten zum Anzeigen.</em></p>';
      if (window.temperaturChart && typeof window.temperaturChart.destroy === 'function') {
        window.temperaturChart.destroy();
        window.temperaturChart = null;
      }
      return;
    }

    const labels = chartData.map(d => 
      d.date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
    );
    const temperatures = chartData.map(d => d.temp);

    // Destroy existing chart
    if (window.temperaturChart && typeof window.temperaturChart.destroy === 'function') {
      window.temperaturChart.destroy();
    }

    const ctx = canvas.getContext('2d');
    window.temperaturChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Temperatur (°C)',
          data: temperatures,
          borderColor: '#0d6efd',
          backgroundColor: 'rgba(13, 110, 253, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            position: 'top'
          }
        },
        scales: {
          y: {
            beginAtZero: false,
            max: Math.max(...temperatures) + 5, // Prevent extreme scaling
            title: {
              display: true,
              text: 'Temperatur (°C)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Datum'
            }
          }
        }
      }
    });

    console.log('Chart successfully created:', window.temperaturChart);

  } catch (err) {
    el.innerHTML = '<p class="text-danger">Fehler beim Laden der Statistik: ' + err.message + '</p>';
    if (window.temperaturChart && typeof window.temperaturChart.destroy === 'function') {
      window.temperaturChart.destroy();
      window.temperaturChart = null;
    }
  }
}

// ========== INITIALIZATION ==========
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('toggleAuth').addEventListener('click', toggleAuthMode);
  document.getElementById('backToLogin').addEventListener('click', toggleAuthMode);
  document.getElementById('authForm').addEventListener('submit', handleAuthSubmit);
  document.getElementById('weatherForm').addEventListener('submit', handleWeatherSubmit);
  document.getElementById('editForm').addEventListener('submit', handleEditSubmit);
  document.getElementById('closeEditModalBtn').addEventListener('click', closeEditModal);

  showSection('home');

  // Event delegation for dynamic buttons
  document.addEventListener('click', (e) => {
    const deleteBtn = e.target.closest('.delete-btn');
    if (deleteBtn) {
      e.preventDefault();
      e.stopPropagation();
      const id = deleteBtn.dataset.id;
      // disable to avoid double-invocation from accidental double-clicks
      try { deleteBtn.disabled = true; } catch (e) {}
      Promise.resolve(deleteEntry(id)).finally(() => { try { deleteBtn.disabled = false; } catch(e){} });
      return;
    }

    const editBtn = e.target.closest('.edit-btn');
    if (editBtn) {
      e.preventDefault();
      e.stopPropagation();
      const id = editBtn.dataset.id;
      editEntry(id);
      return;
    }
  });
});
</script>
